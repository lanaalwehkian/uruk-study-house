<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login | URUK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#091416;--panel:#12272a;--panel2:#173034;--cream:#eee7da;--muted:#9ba9a5;--gold:#c7a77a;--gold2:#dec39b;--line:rgba(238,231,218,.11)}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:var(--bg);color:var(--cream);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:38px;box-shadow:0 25px 70px rgba(0,0,0,.3);text-align:center}.logo{width:78px;height:78px;object-fit:contain;margin-bottom:22px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px;margin-bottom:10px}.box h1{font-size:36px;font-weight:500}.box p{color:var(--muted);margin:8px 0 28px}.group{text-align:left;margin-bottom:17px}label{display:block;font-size:12px;color:#d8cfbf;margin-bottom:7px}input{width:100%;height:50px;border-radius:9px;border:1px solid rgba(238,231,218,.14);background:#0d1d20;color:var(--cream);padding:0 14px;font:inherit;outline:none}input:focus{border-color:var(--gold)}button{width:100%;height:53px;border:0;border-radius:9px;background:var(--gold);font-weight:700;letter-spacing:1.3px;cursor:pointer;margin-top:8px}button:hover{background:var(--gold2)}.error{background:rgba(160,70,70,.15);border:1px solid #a05a5a;color:#e5bcbc;padding:12px;border-radius:9px;font-size:13px;margin-bottom:18px}.back{display:block;color:var(--gold);font-size:12px;margin-top:20px}
</style></head><body><div class="box"><img class="logo" src="{{ url_for('static', filename='images/uruk-logo.png') }}" alt="URUK"><div class="eyebrow">URUK STUDY HOUSE</div><h1>Admin Portal</h1><p>Manage rooms and reservations.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><div class="group"><label>Username</label><input name="username" required></div><div class="group"><label>Password</label><input name="password" type="password" required></div><button type="submit">SIGN IN</button></form><a class="back" href="/">← Back to URUK</a></div></body></html>
